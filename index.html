  <!-- js/core/input.js -->
  <script>
class InputManager {
  constructor() {
    this.keys = new Map();
    this.pressed = new Set();
    this.released = new Set();

    window.addEventListener("keydown", e => {
      if (!this.keys.get(e.code)) this.pressed.add(e.code);
      this.keys.set(e.code, true);
      if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) {
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", e => {
      this.keys.set(e.code, false);
      this.released.add(e.code);
    });
  }

  down(code) {
    return this.keys.get(code) === true;
  }

  justPressed(code) {
    return this.pressed.has(code);
  }

  justReleased(code) {
    return this.released.has(code);
  }

  axis(negative, positive) {
    return (this.down(positive) ? 1 : 0) - (this.down(negative) ? 1 : 0);
  }

  endFrame() {
    this.pressed.clear();
    this.released.clear();
  }
}

window.InputManager = InputManager;

  </script>
  <!-- js/core/camera.js -->
  <script>
class Camera {
  constructor(viewWidth, viewHeight) {
    this.x = 0;
    this.y = 0;
    this.targetX = 0;
    this.targetY = 0;
    this.viewWidth = viewWidth;
    this.viewHeight = viewHeight;
    this.worldWidth = viewWidth;
    this.worldHeight = viewHeight;
    this.smoothing = 7.5;
    this.lookAhead = 120;
    this.debug = false;
  }

  setWorldBounds(width, height) {
    this.worldWidth = width;
    this.worldHeight = height;
  }

  follow(target, dt) {
    const dir = Math.sign(target.vx || 0);
    this.targetX = target.x + target.w * 0.5 - this.viewWidth * 0.36 + dir * this.lookAhead;
    this.targetY = target.y + target.h * 0.5 - this.viewHeight * 0.56;

    const k = 1 - Math.exp(-this.smoothing * dt);
    this.x += (this.targetX - this.x) * k;
    this.y += (this.targetY - this.y) * k;

    this.x = Math.max(0, Math.min(this.x, this.worldWidth - this.viewWidth));
    this.y = Math.max(0, Math.min(this.y, this.worldHeight - this.viewHeight));
  }

  worldToScreen(x, y) {
    return { x: x - this.x, y: y - this.y };
  }
}

window.Camera = Camera;

  </script>
  <!-- js/core/physics.js -->
  <script>
class PhysicsWorld {
  constructor({ gravity = 1550 } = {}) {
    this.gravity = gravity;
    this.solids = [];
  }

  setSolids(solids) {
    this.solids = solids;
  }

  moveBody(body, dt) {
    body.prevX = body.x;
    body.prevY = body.y;

    body.vy += this.gravity * dt;

    body.x += body.vx * dt;
    this._resolveHorizontal(body);

    body.y += body.vy * dt;
    body.onGround = false;
    this._resolveVertical(body);
  }

  _resolveHorizontal(body) {
    for (const s of this.solids) {
      if (!this._overlap(body, s)) continue;

      if (body.vx > 0) body.x = s.x - body.w;
      else if (body.vx < 0) body.x = s.x + s.w;

      body.vx = 0;
    }
  }

  _resolveVertical(body) {
    for (const s of this.solids) {
      if (!this._overlap(body, s)) continue;

      if (body.vy > 0) {
        body.y = s.y - body.h;
        body.vy = 0;
        body.onGround = true;
      } else if (body.vy < 0) {
        body.y = s.y + s.h;
        body.vy = 0;
      }
    }
  }

  _overlap(a, b) {
    return (
      a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y
    );
  }
}

window.PhysicsWorld = PhysicsWorld;

  </script>
  <!-- js/core/animation.js -->
  <script>
class AnimationState {
  constructor(name = "idle") {
    this.name = name;
    this.time = 0;
    this.frame = 0;
  }

  set(name) {
    if (name === this.name) return;
    this.name = name;
    this.time = 0;
    this.frame = 0;
  }

  update(dt, fps = 10, frames = 4) {
    this.time += dt;
    this.frame = Math.floor(this.time * fps) % Math.max(1, frames);
  }
}

window.AnimationState = AnimationState;

  </script>
  <!-- js/core/sceneManager.js -->
  <script>
class SceneManager {
  constructor() {
    this.current = "game";
    this.previous = null;
    this.onChange = null;
  }

  change(name) {
    if (name === this.current) return;
    this.previous = this.current;
    this.current = name;
    if (typeof this.onChange === "function") this.onChange(name, this.previous);
  }

  is(name) {
    return this.current === name;
  }
}

window.SceneManager = SceneManager;

  </script>
  <!-- js/core/entityManager.js -->
  <script>
class EntityManager {
  constructor() {
    this.items = [];
  }

  add(entity) {
    this.items.push(entity);
    return entity;
  }

  update(dt, world) {
    for (const entity of this.items) {
      if (entity.active === false) continue;
      if (typeof entity.update === "function") entity.update(dt, world);
    }
  }

  draw(renderer, now) {
    for (const entity of this.items) {
      if (entity.active === false) continue;
      if (typeof entity.draw === "function") entity.draw(renderer, now);
    }
  }
}

window.EntityManager = EntityManager;

  </script>
  <!-- js/core/triggerZone.js -->
  <script>
class TriggerZone {
  constructor(x, y, w, h, options = {}) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.once = options.once ?? true;
    this.active = true;
    this.triggered = false;
    this.onEnter = options.onEnter || null;
  }

  contains(entity) {
    return (
      entity.x < this.x + this.w &&
      entity.x + entity.w > this.x &&
      entity.y < this.y + this.h &&
      entity.y + entity.h > this.y
    );
  }

  update(entity) {
    if (!this.active) return;
    if (this.contains(entity) && !this.triggered) {
      this.triggered = true;
      if (typeof this.onEnter === "function") this.onEnter(this, entity);
      if (this.once) this.active = false;
    }
  }
}

window.TriggerZone = TriggerZone;

  </script>
  <!-- js/core/audio.js -->
  <script>
class AudioSystem {
  constructor() {
    this.ctx = null;
    this.musicTimer = null;
    this.step = 0;
    this.section = 0;
    this.musicEnabled = true;
    this.bpm = 154;
    this.eighth = (60 / this.bpm) / 2;
    this.sections = [
      {
        lead:[330,392,440,494,440,392,330,294,330,392,494,523,494,440,392,330],
        bass:[110,110,98,98,123,123,110,110],
        chord:[220,262,330]
      },
      {
        lead:[392,440,494,587,523,494,440,392,440,494,587,659,587,523,494,440],
        bass:[123,123,110,110,147,147,123,123],
        chord:[247,294,370]
      },
      {
        lead:[294,330,370,440,392,370,330,294,262,294,330,392,370,330,294,247],
        bass:[98,98,110,110,82,82,98,98],
        chord:[196,247,294]
      }
    ];
  }

  ensure() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  }

  tone(freq, dur=.1, type="square", vol=.03, when=0) {
    const ac = this.ensure();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const t = ac.currentTime + when;
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ac.destination);
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + .01);
    gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.start(t);
    osc.stop(t + dur + .02);
  }

  noise(dur=.04, vol=.012) {
    const ac = this.ensure();
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<len;i++) data[i] = (Math.random()*2-1)*(1-i/len);
    const src = ac.createBufferSource();
    const gain = ac.createGain();
    src.buffer = buf;
    gain.gain.value = vol;
    src.connect(gain);
    gain.connect(ac.destination);
    src.start();
  }

  kick() {
    const ac = this.ensure();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const t = ac.currentTime;
    osc.type = "sine";
    osc.frequency.setValueAtTime(110,t);
    osc.frequency.exponentialRampToValueAtTime(48,t+.12);
    gain.gain.setValueAtTime(.08,t);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.14);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    osc.stop(t+.15);
  }

  snare() {
    this.noise(.08,.035);
    this.tone(180,.07,"triangle",.018);
  }

  musicTick() {
    if (!this.musicEnabled) return;
    const s = this.sections[this.section % this.sections.length];
    const local = this.step % 16;
    this.tone(s.lead[local], this.eighth*.75, local%4===0 ? "sawtooth" : "square", .021);
    if (local%2===0) this.tone(s.bass[(local/2)%s.bass.length|0], this.eighth*1.7, "triangle", .035);
    if (local%8===0) s.chord.forEach(n => this.tone(n,this.eighth*3.3,"square",.005));
    if (local%4===0) this.kick();
    if (local%4===2) this.snare();
    if (local%2===1) this.noise(.018,.007);
    this.step++;
    if (local===15) this.section++;
  }

  startMusic() {
    this.ensure();
    if (this.musicTimer) return;
    this.musicTick();
    this.musicTimer = setInterval(() => this.musicTick(), this.eighth*1000);
  }

  sfx(name) {
    if (name==="jump") this.tone(430,.08,"square",.025);
    if (name==="phone") {
      this.tone(620,.09,"square",.06);
      setTimeout(()=>this.tone(760,.11,"square",.05),100);
    }
    if (name==="hit") this.tone(145,.16,"sawtooth",.07);
    if (name==="coffee") {
      this.tone(660,.11,"triangle",.045);
      setTimeout(()=>this.tone(880,.17,"triangle",.045),130);
    }
    if (name==="horn") {
      this.tone(220,.13,"square",.06);
      setTimeout(()=>this.tone(180,.15,"square",.05),90);
    }
  }
}

window.AudioSystem = AudioSystem;

  </script>
  <!-- js/core/particles.js -->
  <script>
class ParticleSystem {
  constructor() {
    this.particles = [];
  }

  burst(x, y, count=12, color="#f2c94c") {
    for (let i=0; i<count; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 60 + Math.random() * 170;
      this.particles.push({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 60,
        life: .45 + Math.random() * .45,
        maxLife: .9,
        size: 2 + Math.random() * 4,
        color
      });
    }
  }

  update(dt) {
    for (const p of this.particles) {
      p.life -= dt;
      p.vy += 300 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    this.particles = this.particles.filter(p => p.life > 0);
  }

  draw(renderer) {
    const ctx = renderer.ctx;
    for (const p of this.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }
}

window.ParticleSystem = ParticleSystem;

  </script>
  <!-- js/core/renderer.js -->
  <script>
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.ctx.imageSmoothingEnabled = false;
    this.width = canvas.width;
    this.height = canvas.height;
  }

  clear() {
    this.ctx.clearRect(0, 0, this.width, this.height);
  }

  drawBackground(camera, time) {
    const ctx = this.ctx;
    const t = time * 0.001;

    // Industrial warehouse atmosphere: deep ceiling -> cool concrete horizon.
    const wall = ctx.createLinearGradient(0, 0, 0, this.height);
    wall.addColorStop(0, "#10171c");
    wall.addColorStop(0.16, "#26343c");
    wall.addColorStop(0.50, "#60727a");
    wall.addColorStop(0.75, "#8e9999");
    wall.addColorStop(1, "#b9bdb8");
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, this.width, this.height);

    // Far roof panels.
    ctx.fillStyle = "rgba(7,11,14,.34)";
    for (let y=0; y<128; y+=22) ctx.fillRect(0,y,this.width,10);

    // Trusses: parallax gives strong depth while the player moves.
    const beamOffset = -(camera.x * 0.055) % 360;
    ctx.strokeStyle = "#1b252b";
    ctx.lineWidth = 9;
    for (let x = beamOffset - 360; x < this.width + 360; x += 360) {
      ctx.beginPath();
      ctx.moveTo(x, 106);
      ctx.lineTo(x + 180, 20);
      ctx.lineTo(x + 360, 106);
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(155,175,184,.28)";
      ctx.beginPath();
      ctx.moveTo(x+12,101); ctx.lineTo(x+180,27); ctx.lineTo(x+348,101); ctx.stroke();
      ctx.strokeStyle = "#1b252b"; ctx.lineWidth = 9;
    }

    // Structural columns + wall bays.
    const postOffset = -(camera.x * 0.115) % 250;
    for (let x = postOffset - 250; x < this.width + 250; x += 250) {
      ctx.fillStyle = "#34434b";
      ctx.fillRect(x + 14, 96, 13, 310);
      ctx.fillStyle = "rgba(255,255,255,.10)";
      ctx.fillRect(x + 17, 96, 3, 310);
      ctx.fillStyle = "rgba(16,24,29,.16)";
      ctx.fillRect(x + 35, 180, 170, 3);
      ctx.fillRect(x + 35, 270, 170, 3);
    }

    // Hanging LED strips, light halos and cones.
    const lightOffset = -(camera.x * 0.075) % 300;
    for (let x = lightOffset - 300; x < this.width + 300; x += 300) {
      const pulse = .88 + Math.sin(t*2 + x*.01)*.05;
      const glow = ctx.createRadialGradient(x+150,58,5,x+150,58,125);
      glow.addColorStop(0, `rgba(255,248,205,${0.14*pulse})`);
      glow.addColorStop(1, "rgba(255,248,205,0)");
      ctx.fillStyle=glow; ctx.fillRect(x+20,0,260,210);
      ctx.fillStyle = "#eef2cf";
      ctx.fillRect(x + 82, 48, 136, 10);
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.fillRect(x + 88, 49, 124, 2);
      ctx.fillStyle = "rgba(255,246,195,.048)";
      ctx.beginPath();
      ctx.moveTo(x + 94, 58); ctx.lineTo(x + 206, 58);
      ctx.lineTo(x + 272, 382); ctx.lineTo(x + 22, 382);
      ctx.closePath(); ctx.fill();
    }

    // Horizon separation + industrial floor gradient.
    ctx.fillStyle = "rgba(22,31,35,.34)";
    ctx.fillRect(0, 354, this.width, 14);
    const floor = ctx.createLinearGradient(0, 365, 0, this.height);
    floor.addColorStop(0, "#aeb4b0");
    floor.addColorStop(.48, "#858e8a");
    floor.addColorStop(1, "#465158");
    ctx.fillStyle=floor; ctx.fillRect(0,365,this.width,this.height-365);

    // Perspective floor seams.
    ctx.strokeStyle = "rgba(40,50,54,.38)";
    ctx.lineWidth = 2;
    for (let y = 416; y < this.height; y += 37) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(this.width,y); ctx.stroke();
    }
    const gridOffset = -(camera.x * .35) % 170;
    for (let x=gridOffset-170; x<this.width+170; x+=170) {
      ctx.beginPath(); ctx.moveTo(x,365); ctx.lineTo(x+95,this.height); ctx.stroke();
    }

    // Painted traffic lanes.
    ctx.fillStyle="rgba(221,175,50,.72)";
    ctx.fillRect(0,548,this.width,5);
    ctx.fillStyle="rgba(255,255,255,.28)";
    for (let x=(-camera.x*.26)%190-190;x<this.width;x+=190) ctx.fillRect(x,626,92,5);

    // Slow atmospheric dust particles (screen-space parallax layer).
    ctx.fillStyle="rgba(245,242,218,.23)";
    for (let i=0;i<34;i++) {
      const px=(i*173 + t*(9+(i%5)*3) - camera.x*.02)%(this.width+80)-40;
      const py=115 + ((i*83)%410) + Math.sin(t*.7+i)*8;
      const r=1+(i%3)*.45;
      ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
    }
  }

  beginWorld(camera) {
    this.ctx.save();
    this.ctx.translate(-camera.x, -camera.y);
  }

  endWorld() {
    this.ctx.restore();
  }

  drawRack(x, y, w, h) {
    const ctx = this.ctx;
    ctx.save();
    // Back shadow / depth.
    ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fillRect(x+9,y+9,w,h);

    // Blue-grey uprights with highlights.
    ctx.fillStyle="#34434c";
    ctx.fillRect(x, y, 10, h); ctx.fillRect(x+w-10,y,10,h);
    ctx.fillRect(x,y,w,9); ctx.fillRect(x,y+h-9,w,9);
    ctx.fillStyle="rgba(185,205,214,.24)";
    ctx.fillRect(x+2,y,2,h); ctx.fillRect(x+w-8,y,2,h);

    // Shelves and pallets.
    for (let yy = y + 18; yy < y + h - 44; yy += 61) {
      ctx.fillStyle="#56656d"; ctx.fillRect(x+7,yy+39,w-14,7);
      ctx.fillStyle="#76502d"; ctx.fillRect(x+16,yy+34,w-32,6);
      for (let xx = x + 20; xx < x + w - 48; xx += 67) {
        const shade=((xx+yy)/10|0)%2===0?"#a06b35":"#8b592a";
        ctx.fillStyle=shade; ctx.fillRect(xx,yy,48,34);
        ctx.fillStyle="rgba(255,220,150,.12)"; ctx.fillRect(xx+3,yy+3,42,3);
        ctx.strokeStyle="#68401e"; ctx.lineWidth=1; ctx.strokeRect(xx+.5,yy+.5,47,33);
        ctx.fillStyle="#d7c39a"; ctx.fillRect(xx+30,yy+10,12,7);
        ctx.fillStyle="#6c4525"; ctx.fillRect(xx,yy+28,48,6);
      }
    }
    // Foot plates.
    ctx.fillStyle="#202a30"; ctx.fillRect(x-4,y+h-4,18,6); ctx.fillRect(x+w-14,y+h-4,18,6);
    ctx.restore();
  }

  drawPlayer(player, time) {
    const ctx = this.ctx;
    const phase = player.anim ? player.anim.time * 10 : 0;
    const moving=player.onGround && Math.abs(player.vx)>10;
    const bob=moving?Math.sin(phase)*2:0;
    const stride=moving?Math.sin(phase)*3:0;

    ctx.save();
    // Ground shadow.
    ctx.globalAlpha=.28;
    ctx.fillStyle="#0b0f12";
    ctx.beginPath(); ctx.ellipse(player.x+player.w/2,player.y+66,25,6,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;

    ctx.translate(player.x, player.y);
    if (player.facing < 0) { ctx.translate(player.w,0); ctx.scale(-1,1); }

    // Legs + reinforced knees (same technician silhouette, cleaner rendering).
    ctx.fillStyle="#1b2329";
    ctx.fillRect(7-stride*.25,43+bob,11,20); ctx.fillRect(22+stride*.25,43-bob,11,20);
    ctx.fillStyle="#2d3941";
    ctx.fillRect(8-stride*.25,47+bob,9,7); ctx.fillRect(23+stride*.25,47-bob,9,7);
    ctx.fillStyle="#090d10";
    ctx.fillRect(3-stride*.25,59+bob,18,7); ctx.fillRect(20+stride*.25,59-bob,18,7);
    ctx.fillStyle="#3d484e";
    ctx.fillRect(6-stride*.25,60+bob,12,2); ctx.fillRect(23+stride*.25,60-bob,12,2);

    // Work shirt, collar, seams and TECH marking.

  <script>
class Player {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.prevX = x;
    this.prevY = y;
    this.w = 40;
    this.h = 66;
    this.vx = 0;
    this.vy = 0;
    this.speed = 310;
    this.accel = 1900;
    this.friction = 2300;
    this.jump = 610;
    this.onGround = false;
    this.facing = 1;
    this.anim = new AnimationState("idle");
  }

  moveTowards(current, target, maxDelta) {
    if (Math.abs(target - current) <= maxDelta) return target;
    return current + Math.sign(target - current) * maxDelta;
  }

  update(dt, input, physics, world) {
    const axis = input.axis("ArrowLeft", "ArrowRight");
    const targetVx = axis * this.speed;

    if (axis !== 0) {
      this.vx = this.moveTowards(this.vx, targetVx, this.accel * dt);
      this.facing = axis;
    } else {
      this.vx = this.moveTowards(this.vx, 0, this.friction * dt);
    }

    if (input.justPressed("Space") && this.onGround) {
      this.vy = -this.jump;
      this.onGround = false;
      if (world.audio) world.audio.sfx("jump");
    }

    if (!this.onGround) {
      this.anim.set(this.vy < 0 ? "jump" : "fall");
      this.anim.update(dt, 6, 2);
    } else if (Math.abs(this.vx) > 20) {
      this.anim.set("run");
      this.anim.update(dt, 10, 6);
    } else {
      this.anim.set("idle");
      this.anim.update(dt, 4, 4);
    }

    physics.moveBody(this, dt);

    this.x = Math.max(0, Math.min(world.width - this.w, this.x));

    if (this.y > world.height + 180) {
      this.x = 110;
      this.y = 420;
      this.vx = 0;
      this.vy = 0;
    }
  }
}

window.Player = Player;

  constructor() {
    this.pending = null;
    this.ignored = 0;
    this.accepted = 0;
    this.score = 0;

    if (this.pending) return false;
    this.pending = {
      title: data.title,
      description: data.description,
      acceptedText: data.acceptedText || "Intervention acceptée.",
      ignoredText: data.ignoredText || "Intervention ignorée."

    if (!this.pending) return null;
    const result = this.pending;
    this.pending = null;
    this.accepted++;
    this.score += 100;
    return result;
  }

  ignore() {
    if (!this.pending) return null;
    const result = this.pending;
    this.pending = null;
    this.ignored++;
    this.score += 250;
    return result;
  }
}

  constructor(x, triggerX, floorY=524) {

    this.triggerX = triggerX;
    this.floorY = floorY;
    this.active = false;
    this.landed = false;

    if (!this.active || this.landed) return;

    this.vy += 920 * dt;
    this.y += this.vy * dt;

    if (this.y + this.h >= this.floorY) {
      this.y = this.floorY - this.h;
      this.vy = 0;

  draw(renderer) {
    if (!this.active) return;
    const ctx = renderer.ctx;
    ctx.fillStyle = "#b67836";

    ctx.strokeStyle = "#5b3517";
    ctx.lineWidth = 3;
    ctx.strokeRect(this.x, this.y, this.w, this.h);
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.w, this.y + this.h);
    ctx.moveTo(this.x + this.w, this.y);

  <script>
class InteractionPrompt {
  constructor() {
    this.visible = false;
    this.title = "";
    this.body = "";
    this.hint = "";
  }

  show(title, body, hint) {
    this.visible = true;
    this.title = title;
    this.body = body;
    this.hint = hint;
  }

  hide() {
    this.visible = false;
  }

  draw(renderer) {
    if (!this.visible) return;
    const ctx = renderer.ctx;

    ctx.fillStyle = "rgba(12,16,20,.96)";
    ctx.fillRect(350, 125, 580, 160);

    ctx.strokeStyle = "#f2c94c";
    ctx.lineWidth = 4;
    ctx.strokeRect(350, 125, 580, 160);

    ctx.fillStyle = "#f2c94c";
    ctx.font = "bold 20px monospace";
    ctx.fillText(this.title, 375, 160);

    ctx.fillStyle = "#fff";
    ctx.font = "17px monospace";

    const words = this.body.split(" ");
    let line = "";
    let y = 195;
    for (const word of words) {
      const test = line + word + " ";
      if (ctx.measureText(test).width > 520) {
        ctx.fillText(line, 375, y);
        line = word + " ";
        y += 26;
      } else {
        line = test;
      }
    }
    ctx.fillText(line, 375, y);

    ctx.fillStyle = "#9fd36d";
    ctx.font = "bold 15px monospace";
    ctx.fillText(this.hint, 375, 255);
  }
}

window.InteractionPrompt = InteractionPrompt;

  </script>

  <script>
class EndScreen {
  constructor() {
    this.mode = null;
    this.title = "";
    this.lines = [];
  }

  show(mode, title, lines=[]) {
    this.mode = mode;
    this.title = title;
    this.lines = lines;
  }

  hide() {
    this.mode = null;
  }

  draw(renderer) {
    if (!this.mode) return;
    const ctx = renderer.ctx;

    ctx.fillStyle = "rgba(0,0,0,.78)";
    ctx.fillRect(0,0,renderer.width,renderer.height);

    const border = this.mode==="win" ? "#f2c94c" : "#c8544b";
    ctx.fillStyle = "rgba(17,22,28,.98)";
    ctx.fillRect(210,155,860,400);
    ctx.strokeStyle = border;
    ctx.lineWidth = 5;
    ctx.strokeRect(210,155,860,400);

    ctx.fillStyle = border;
    ctx.font = "bold 42px monospace";
    ctx.textAlign = "center";
    ctx.fillText(this.title, 640, 225);

    ctx.fillStyle = "#fff";
    ctx.font = "20px monospace";
    let y = 285;
    for (const line of this.lines) {
      ctx.fillText(line, 640, y);
      y += 42;
    }

    ctx.fillStyle="#aeb9c1";
    ctx.font="16px monospace";
    ctx.fillText("R = recommencer",640,515);
    ctx.textAlign="left";
  }
}

window.EndScreen = EndScreen;

  <script>
class Engine {
  constructor({ canvas, update, render, input }) {
    this.canvas = canvas;
    this.updateCallback = update;
    this.renderCallback = render;
    this.input = input;

    this.running = false;
    this.lastTime = 0;
    this.accumulator = 0;
    this.fixedStep = 1 / 60;
    this.maxFrame = 0.1;
    this.fps = 60;

    this._fpsFrames = 0;
    this._fpsLast = performance.now();
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.lastTime = performance.now();
    requestAnimationFrame(this._loop.bind(this));
  }

  stop() {
    this.running = false;
  }

  _loop(now) {
    if (!this.running) return;

    let frameTime = (now - this.lastTime) / 1000;
    this.lastTime = now;
    frameTime = Math.min(frameTime, this.maxFrame);
    this.accumulator += frameTime;

    while (this.accumulator >= this.fixedStep) {
      this.updateCallback(this.fixedStep);
      this.accumulator -= this.fixedStep;
    }

    const alpha = this.accumulator / this.fixedStep;
    this.renderCallback(alpha, now);

    this.input.endFrame();

    this._fpsFrames++;
    if (now - this._fpsLast >= 500) {
      this.fps = this._fpsFrames * 1000 / (now - this._fpsLast);
      this._fpsFrames = 0;
      this._fpsLast = now;
    }

    requestAnimationFrame(this._loop.bind(this));
  }
}

window.Engine = Engine;

  <script>
const canvas = document.getElementById("game");
const boot = document.getElementById("boot");

const input = new InputManager();
const renderer = new Renderer(canvas);
const camera = new Camera(canvas.width, canvas.height);
const scenes = new SceneManager();
const entities = new EntityManager();
const dialog = new DialogBox();
const interaction = new InteractionPrompt();
const botia = new BotIA();
const audio = new AudioSystem();
const particles = new ParticleSystem();
const endScreen = new EndScreen();

const world = { width: 4200, height: 720, audio };
camera.setWorldBounds(world.width, world.height);

const platforms = [
  { x: 0, y: 566, w: world.width, h: 90 },
  { x: 530, y: 490, w: 210, h: 22 },
  { x: 930, y: 430, w: 210, h: 22 },
  { x: 1370, y: 500, w: 220, h: 22 },
  { x: 1820, y: 445, w: 210, h: 22 },
  { x: 2290, y: 505, w: 240, h: 22 },
  { x: 2780, y: 455, w: 230, h: 22 },
  { x: 3260, y: 505, w: 220, h: 22 }
];

const walls = [
  { x: 1120, y: 470, w: 30, h: 96 },
  { x: 2570, y: 450, w: 30, h: 116 }
];

const physics = new PhysicsWorld({ gravity: 1550 });
physics.setSolids([...platforms, ...walls]);

let player, safetyWoman, coffee, forklift1, forklift2;
let fallingBoxes, hazards, triggers;
let safetyScore, gameScore, coffeeLives, coffeeReached;
let currentInteractable, lastHitTime, audioStarted, lastHornTime;
let wrenchProjectiles, lastThrowTime, qhseDefeated;

function makeLevel() {
  entities.items.length = 0;
  particles.particles.length = 0;

  player = new Player(110, 420);
  safetyWoman = entities.add(new SafetyWoman(820, 484));
  coffee = entities.add(new CoffeeMachine(3918, 421));

  entities.add(new Crate(690, 524, 42));
  entities.add(new Crate(732, 524, 42));
  entities.add(new Crate(1590, 524, 42));
  entities.add(new Crate(3010, 524, 42));

  forklift1 = entities.add(new Forklift(1220, 514, 1180, 1460, 105));
  forklift2 = entities.add(new Forklift(2700, 514, 2640, 2950, 130));

  fallingBoxes = [
    new FallingBox(1510, 1410, 566),
    new FallingBox(2350, 2240, 566),
    new FallingBox(3170, 3050, 566)
  ];

  hazards = [
    new HazardZone(1040, 548, 92, 16, "oil"),
    new HazardZone(2140, 536, 90, 28, "electric"),
    new HazardZone(3020, 548, 90, 16, "oil")
  ];

  safetyScore = 100;
  gameScore = 0;
  coffeeLives = 3;
  coffeeReached = false;
  currentInteractable = null;
  lastHitTime = 0;
  lastHornTime = 0;
  wrenchProjectiles = [];
  lastThrowTime = 0;
  qhseDefeated = false;

  botia.pending = null;
  botia.ignored = 0;
  botia.accepted = 0;
  botia.score = 0;

  endScreen.hide();
  scenes.change("game");

  triggers = [
    new TriggerZone(700, 430, 260, 150, {
      once: true,
      onEnter: () => {
        dialog.show("SÉCURITÉ", "Mets ton gilet ! Et tes EPI aussi !");
        safetyScore = Math.max(0, safetyScore - 5);
      }
    }),
    new TriggerZone(900, 430, 240, 150, {
      once: true,
      onEnter: () => {
        dialog.show("SÉCURITÉ", "Le passage piéton, bordel ! Il est juste devant toi !");
        safetyScore = Math.max(0, safetyScore - 10);
      }
    }),
    new TriggerZone(1660, 400, 320, 180, {
      once: true,
      onEnter: () => {
        botia.createIntervention({
          title: "BOT.I.A — TRIEUR",
          description: "Cellule en défaut sur le trieur. Intervention requise.",
          acceptedText: "Très bien. Tu répares... le café attendra.",
          ignoredText: "Intervention ignorée. Direction café."
        });
        audio.sfx("phone");
        dialog.show("BOT.I.A", "Intervention trieur détectée. E pour décider quoi faire.");
      }
    }),
    new TriggerZone(2460, 400, 330, 180, {
      once: true,
      onEnter: () => {
        botia.createIntervention({
          title: "BOT.I.A — BATTERIES",
          description: "Chargeur batterie en défaut au pool. Intervention demandée.",
          acceptedText: "Tu as choisi la maintenance. Courage.",
          ignoredText: "Chargeur ignoré. Le café est plus près."
        });
        audio.sfx("phone");
        dialog.show("BOT.I.A", "Nouvelle intervention au pool batteries.");
      }
    }),
    new TriggerZone(3650, 430, 500, 160, {
      once: true,
      onEnter: () => dialog.show("TECHNICIEN", "Je le vois... cette fois personne ne m'arrête.")
    })
  ];
}

function startAudioOnce() {
  if (audioStarted) return;
  audioStarted = true;
  audio.startMusic();
}
window.addEventListener("pointerdown", startAudioOnce, { once:true });
window.addEventListener("keydown", startAudioOnce, { once:true });

function overlaps(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y;
}

function playerNear(rect, distance=85) {
  const cx=player.x+player.w/2, cy=player.y+player.h/2;
  const rx=rect.x+rect.w/2, ry=rect.y+rect.h/2;
  return Math.hypot(cx-rx,cy-ry)<=distance;
}

function damagePlayer(message, amount=20, knockback=70) {
  const now=performance.now();
  if (now-lastHitTime<1100 || scenes.is("end")) return;
  lastHitTime=now;

  coffeeLives=Math.max(0,coffeeLives-1);
  gameScore=Math.max(0,gameScore-100);
  player.vy=-280;
  player.x=Math.max(0,player.x-knockback);
  audio.sfx("hit");
  particles.burst(player.x+player.w/2,player.y+player.h/2,14,"#f2c94c");
  dialog.show("TECHNICIEN",message,1.7);

  if (coffeeLives<=0) {
    scenes.change("end");
    endScreen.show("lose","GAME OVER",[
      "Trop d'interventions, de risques et toujours pas de café.",
      `Score : ${gameScore}`,
      `Sécurité : ${safetyScore}%`
    ]);
  }
}


function throwWrench() {
  const now=performance.now();
  if (now-lastThrowTime<280 || scenes.is("pause") || scenes.is("end")) return;
  lastThrowTime=now;
  const x=player.facing>0 ? player.x+player.w+5 : player.x-38;
  const y=player.y+27;
  wrenchProjectiles.push(new WrenchProjectile(x,y,player.facing));
  particles.burst(player.x+player.w/2,player.y+31,5,"#c9d1d6");
}

function hitTarget(projectile,target) {
  return target && target.active!==false && projectile.active && overlaps(projectile,target);
}

function updateWrenches(dt) {
  if (input.justPressed("KeyX")) throwWrench();

  for (const wrench of wrenchProjectiles) {
    wrench.update(dt);
    if (!wrench.active) continue;

    if (!qhseDefeated && safetyWoman.active!==false && hitTarget(wrench,safetyWoman)) {
      wrench.active=false;
      safetyWoman.active=false;
      qhseDefeated=true;
      gameScore+=300;
      particles.burst(safetyWoman.x+safetyWoman.w/2,safetyWoman.y+30,18,"#f2c94c");
      dialog.show("TECHNICIEN","QHSE neutralisée... voie libre pour le café !",1.8);
      continue;
    }

    for (const f of [forklift1,forklift2]) {
      if (hitTarget(wrench,f)) {
        wrench.active=false;
        f.active=false;
        f.speed=0;
        gameScore+=200;
        particles.burst(f.x+f.w/2,f.y+f.h/2,20,"#d6a42f");
        dialog.show("TECHNICIEN","Chariot stoppé ! La clé plate ninja a encore frappé.",1.6);
        break;
      }
    }
  }
  wrenchProjectiles=wrenchProjectiles.filter(w=>w.active);
}

function updateForkliftHorn() {
  const now=performance.now();
  for (const f of [forklift1,forklift2]) {
    if (f.active===false) continue;
    const dx=Math.abs((player.x+player.w/2)-(f.x+f.w/2));
    if (dx<180 && now-lastHornTime>1800) {
      lastHornTime=now;
      audio.sfx("horn");
      dialog.show("CARISTE","POOOON ! Passage chariot !",1.1);
    }
    if (overlaps(player,f)) damagePlayer("Même le chariot s'y met ?!",20,95);
  }
}

function updateHazards() {
  for (const h of hazards) {
    if (!h.overlaps(player)) continue;

    if (h.type==="oil" && player.onGround) {
      player.x += Math.sign(player.vx || player.facing) * 4;
    }

    if (h.type==="electric") {
      damagePlayer("Ah super... maintenant je prends le jus !",15,55);
    }
  }

  for (const box of fallingBoxes) {
    if (box.active && overlaps(player,box)) {
      damagePlayer("Et maintenant les cartons qui tombent !",20,65);
    }
  }
}

function updateInteraction() {
  currentInteractable=null;
  interaction.hide();

  if (botia.pending) {
    currentInteractable="botia";
    interaction.show(botia.pending.title,botia.pending.description,"E = IGNORER  ·  A = ACCEPTER");
    return;
  }

  if (playerNear(coffee,125)) {
    currentInteractable="coffee";
    interaction.show("MACHINE À CAFÉ","Tu y es enfin. Appuie sur E pour lancer ton café.","E = PRENDRE LE CAFÉ");
  }
}

function handleInteractions() {
  if (currentInteractable==="botia") {
    if (input.justPressed("KeyE")) {
      const result=botia.ignore();
      if (result) {
        gameScore+=250;
        dialog.show("TECHNICIEN",result.ignoredText);
      }
    }
    if (input.justPressed("KeyA")) {
      const result=botia.accept();
      if (result) {
        gameScore+=100;
        dialog.show("BOT.I.A",result.acceptedText);
      }
    }
  }

  if (currentInteractable==="coffee" && input.justPressed("KeyE") && !coffeeReached) {
    coffeeReached=true;
    gameScore+=1000+coffeeLives*150;
    audio.sfx("coffee");
    particles.burst(coffee.x+coffee.w/2,coffee.y+60,28,"#f2c94c");
    dialog.show("TECHNICIEN","ENFIN... laissez-moi prendre mon café !");

    setTimeout(()=>{
      if (scenes.is("end")) return;
      audio.sfx("phone");
      dialog.show("BOT.I.A","ARRÊT GÉNÉRAL MÉCANISATION.");
    },1700);

    setTimeout(()=>{
      if (scenes.is("end")) return;
      dialog.show("TECHNICIEN","MERDE ! LAISSEZ-MOI PRENDRE MON CAFÉ !");
    },3100);

    setTimeout(()=>{
      scenes.change("end");
      endScreen.show("win","CAFÉ ATTEINT !",[
        `Score final : ${gameScore}`,
        `Tasses restantes : ${coffeeLives}/3`,
        `Sécurité : ${safetyScore}%`,
        `Interventions ignorées : ${botia.ignored}`
      ]);
    },5000);
  }
}

function update(dt) {
  if (input.justPressed("KeyR") && scenes.is("end")) {
    makeLevel();
    return;
  }

  if (input.justPressed("KeyP") && !scenes.is("end")) {
    scenes.change(scenes.is("pause") ? "game" : "pause");
  }

  if (input.justPressed("F1")) camera.debug=!camera.debug;
  if (scenes.is("pause") || scenes.is("end")) return;

  player.update(dt,input,physics,world);
  entities.update(dt,world);
  dialog.update(dt);
  particles.update(dt);

  for (const trigger of triggers) trigger.update(player);
  for (const box of fallingBoxes) box.update(dt,player);

  updateWrenches(dt);
  updateForkliftHorn();
  updateHazards();
  updateInteraction();
  handleInteractions();
  camera.follow(player,dt);
}

function drawCrosswalk(ctx) {
  const x=850,y=536;
  ctx.fillStyle="#f1f1ed";
  for (let i=0;i<7;i++) ctx.fillRect(x+i*28,y,16,30);
  ctx.fillStyle="#d4a232";
  ctx.fillRect(x-12,y-5,215,5);
}


function drawIndustrialDetails(now) {
  const ctx=renderer.ctx;
  const t=now*.001;

  // High pipes and cable trays spanning the warehouse.
  ctx.strokeStyle="#29373f"; ctx.lineWidth=10;
  ctx.beginPath(); ctx.moveTo(0,120); ctx.lineTo(world.width,120); ctx.stroke();
  ctx.strokeStyle="#6c7e87"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,116); ctx.lineTo(world.width,116); ctx.stroke();
  ctx.strokeStyle="#3b474e"; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(0,205); ctx.lineTo(world.width,205); ctx.stroke();
  for(let x=90;x<world.width;x+=280){
    ctx.fillStyle="#26333a";ctx.fillRect(x,113,12,30);
    ctx.fillStyle="#8c9ba1";ctx.fillRect(x+3,116,3,24);
  }

  // Safety rails / bollards in several zones.
  const rails=[430,1160,2010,3320];
  for(const x of rails){
    ctx.fillStyle="#d6a632"; ctx.fillRect(x,505,9,61); ctx.fillRect(x+112,505,9,61);
    ctx.fillStyle="#252d32"; ctx.fillRect(x+2,513,5,10);ctx.fillRect(x+2,536,5,10);
    ctx.fillStyle="#d6a632"; ctx.fillRect(x,518,121,7); ctx.fillRect(x,541,121,7);
  }

  // Emergency signage and tiny wall details.
  for(let x=390;x<world.width;x+=760){
    ctx.fillStyle="#1f6b47";ctx.fillRect(x,275,58,26);
    ctx.fillStyle="#e9f0e5";ctx.font="bold 10px monospace";ctx.fillText("SORTIE",x+8,292);
  }
  for(let x=620;x<world.width;x+=910){
    ctx.fillStyle="#b93d32";ctx.fillRect(x,315,21,30);
    ctx.fillStyle="#f5e8dc";ctx.fillRect(x+8,320,5,18);
  }

  // Floor stains, bolts and worn markings add texture without assets.
  ctx.fillStyle="rgba(35,44,48,.13)";
  for(let i=0;i<55;i++){
    const x=(i*347)%world.width;
    const y=575+(i*47)%105;
    const r=2+(i%4);
    ctx.beginPath();ctx.ellipse(x,y,r*2,r,0,0,Math.PI*2);ctx.fill();
  }

  // Warning beacons in the distance.
  for(let x=520;x<world.width;x+=1180){
    const on=Math.sin(t*5+x*.01)>0;
    if(on){
      const g=ctx.createRadialGradient(x,214,1,x,214,32);
      g.addColorStop(0,"rgba(255,171,38,.35)");g.addColorStop(1,"rgba(255,171,38,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,214,32,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle=on?"#f2aa2e":"#8a621f";ctx.beginPath();ctx.arc(x,214,5,0,Math.PI*2);ctx.fill();
  }
}

function drawCupIcon(ctx,x,y,filled=true) {
  ctx.save();
  ctx.globalAlpha=filled?1:.18;
  ctx.translate(x,y);
  ctx.fillStyle=filled?"#f4e5c6":"#95a0a4";
  ctx.beginPath(); ctx.roundRect(0,5,29,23,4); ctx.fill();
  ctx.strokeStyle="#10161a";ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(29,16,8,-Math.PI/2,Math.PI/2);ctx.stroke();
  ctx.fillStyle="#5e3a20";ctx.fillRect(4,8,21,5);
  if(filled){
    ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=2;
    const tt=performance.now()*.002;
    for(let i=0;i<2;i++){
      ctx.beginPath();ctx.moveTo(8+i*9,3);ctx.quadraticCurveTo(4+i*9,-3+Math.sin(tt+i)*2,9+i*9,-8);ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPostFX(now) {
  const ctx=renderer.ctx;
  // Cinematic vignette.
  const g=ctx.createRadialGradient(canvas.width/2,canvas.height/2,220,canvas.width/2,canvas.height/2,760);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(.72,"rgba(0,0,0,.03)");g.addColorStop(1,"rgba(0,0,0,.36)");
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);

  // Subtle hit flash makes impacts feel much stronger.
  const hitAge=performance.now()-lastHitTime;
  if(hitAge>=0 && hitAge<180){
    ctx.fillStyle=`rgba(198,45,35,${.22*(1-hitAge/180)})`;ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  // Fine scanline/grain texture, barely visible.
  ctx.fillStyle="rgba(255,255,255,.018)";
  for(let y=0;y<canvas.height;y+=4)ctx.fillRect(0,y,canvas.width,1);
}

function drawWorldDecor(now) {
  const ctx=renderer.ctx;
  drawIndustrialDetails(now);
  const signs=[
    [110,"RÉCEPTION"],[920,"CONVOYEURS"],[1760,"TRIEUR"],
    [2600,"BATTERIES"],[3460,"PAUSE CAFÉ →"]
  ];

  for (const [x,label] of signs) {
    ctx.fillStyle="#1b2329"; ctx.fillRect(x,150,210,44);
    ctx.strokeStyle="#f2c94c"; ctx.lineWidth=3; ctx.strokeRect(x,150,210,44);
    ctx.fillStyle="#f2c94c"; ctx.font="bold 17px monospace"; ctx.fillText(label,x+16,178);
  }

  renderer.drawRack(50,235,270,250);
  renderer.drawRack(760,225,290,260);
  renderer.drawRack(1520,235,280,250);
  renderer.drawRack(2260,220,300,265);
  renderer.drawRack(3030,230,290,255);

  const conveyors=[[350,535,250],[1220,535,250],[2050,535,260],[3380,535,260]];
  for (const [x,y,w] of conveyors) {
    ctx.fillStyle="#424c53"; ctx.fillRect(x,y,w,24);
    const rollerOffset=(now*.06)%30;
    ctx.fillStyle="#171d21";
    for (let rx=x-30+rollerOffset;rx<x+w;rx+=30) ctx.fillRect(rx,y+5,18,14);
    ctx.fillStyle="#2d353a";
    ctx.fillRect(x+12,y+24,8,31); ctx.fillRect(x+w-20,y+24,8,31);
  }

  for (const p of platforms) {
    if (p.y<566) {
      ctx.fillStyle="#48545c"; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle="#d4a232";
      for (let x=p.x;x<p.x+p.w;x+=34) ctx.fillRect(x,p.y,17,5);
    }
  }

  for (const w of walls) {
    ctx.fillStyle="#38434a"; ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle="#d2a232";
    for (let y=w.y;y<w.y+w.h;y+=24) ctx.fillRect(w.x,y,w.w,10);
  }

  drawCrosswalk(ctx);
  for (const h of hazards) h.draw(renderer,now);
  for (const b of fallingBoxes) b.draw(renderer);
}

function drawHUD() {
  const ctx=renderer.ctx;

  ctx.fillStyle="rgba(13,17,22,.92)";
  ctx.fillRect(930,18,315,122);
  ctx.strokeStyle=safetyScore>=80?"#8fc86d":"#f2c94c";
  ctx.lineWidth=3; ctx.strokeRect(930,18,315,122);

  ctx.fillStyle="#fff"; ctx.font="15px monospace";
  ctx.fillText("SÉCURITÉ",950,43);

  ctx.fillStyle=safetyScore>=80?"#8fc86d":"#f2c94c";
  ctx.font="bold 22px monospace"; ctx.fillText(`${safetyScore}%`,1140,47);

  ctx.fillStyle="#6f7b83"; ctx.fillRect(950,59,260,10);
  ctx.fillStyle=safetyScore>=80?"#8fc86d":"#f2c94c";
  ctx.fillRect(950,59,260*(safetyScore/100),10);

  ctx.fillStyle="#f2c94c"; ctx.font="14px monospace";
  ctx.fillText(`SCORE ${String(gameScore).padStart(4,"0")}`,950,96);
  ctx.fillStyle="#d9e1e6"; ctx.font="12px monospace";
  ctx.fillText("X = CLÉ NINJA",950,124);

  // Vie du technicien : tasses de café dessinées dans le même style que le jeu.
  ctx.fillStyle="#f4eddc";ctx.font="bold 11px monospace";ctx.fillText("VIES",1068,82);
  for (let i=0;i<3;i++) drawCupIcon(ctx,1068+i*46,88,i<coffeeLives);

  ctx.fillStyle="rgba(13,17,22,.90)";
  ctx.fillRect(18,122,385,70);
  ctx.strokeStyle="#657682"; ctx.lineWidth=2; ctx.strokeRect(18,122,385,70);
  ctx.fillStyle="#d9e1e6"; ctx.font="14px monospace"; ctx.fillText("BOT.I.A",34,148);
  ctx.fillStyle="#9fd36d"; ctx.fillText(`IGNORÉES : ${botia.ignored}`,34,174);
  ctx.fillStyle="#f2c94c"; ctx.fillText(`ACCEPTÉES : ${botia.accepted}`,190,174);

  // Compact objective ribbon.
  ctx.fillStyle="rgba(10,14,18,.82)";ctx.fillRect(475,18,390,42);
  ctx.strokeStyle="#6c7b82";ctx.lineWidth=2;ctx.strokeRect(475,18,390,42);
  ctx.fillStyle="#f4eddc";ctx.font="bold 13px monospace";ctx.fillText("OBJECTIF : ATTEINDRE LA MACHINE À CAFÉ",494,44);
}

function render(alpha,now) {
  renderer.clear();
  renderer.drawBackground(camera,now);

  renderer.beginWorld(camera);
  drawWorldDecor(now);
  entities.draw(renderer,now);
  for (const wrench of wrenchProjectiles) wrench.draw(renderer);
  particles.draw(renderer);
  renderer.drawPlayer(player,now);
  renderer.endWorld();

  drawPostFX(now);
  renderer.drawHUD(player,camera,engine);
  drawHUD();
  dialog.draw(renderer);
  interaction.draw(renderer);

  if (scenes.is("pause")) {
    const ctx=renderer.ctx;
    ctx.fillStyle="rgba(0,0,0,.68)"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#f2c94c"; ctx.font="bold 44px monospace"; ctx.fillText("PAUSE CAFÉ",470,340);
    ctx.fillStyle="#fff"; ctx.font="18px monospace"; ctx.fillText("P pour reprendre",535,380);
  }

  endScreen.draw(renderer);
}

const engine=new Engine({canvas,update,render,input});

makeLevel();
boot.classList.add("hidden");
engine.start();

  </script>
